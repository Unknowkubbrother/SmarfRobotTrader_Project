version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarf_db_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: "smarf_trading_db"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smarf_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d smarf_trading_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  smarf_network:
    driver: bridge
