services:
  smarfrobot-mt5:
    build: .
    platform: linux/amd64
    image: ${METATRADER_IMAGE:-smarfrobot_mt5}
    volumes:
      - config:/config
      - ./bots:/bots
      - ${MT5_SNAPSHOT_HOST_DIR:-./snapshots}:/snapshots
      - ${MT5_INSTANCE_HOST_DIR:-./.instances}:/instances
      - ${MT5_SEED_HOST_DIR:-./mt5-seed}:/mt5-seed
      - pydeps:/shared-pydeps
    ports:
      - ${MT5_WEB_PORT:-3000}:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
    environment:
      - CUSTOM_USER=${CUSTOM_USER:-admin}
      - PASSWORD=${PASSWORD:-12345}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_STRICT_SERVER_MATCH=${MT5_STRICT_SERVER_MATCH:-0}
      - MT5_CLEAN_ACCOUNT_CACHE_ON_START=${MT5_CLEAN_ACCOUNT_CACHE_ON_START:-0}
      - MT5_SEED_CONFIG_DIR=${MT5_SEED_CONFIG_DIR:-}
      - MT5_SNAPSHOT_PATH=${MT5_SNAPSHOT_PATH:-/snapshots/mt5-config-snapshot.tgz}
      - BOT_WS_URL=${BOT_WS_URL:-}
      - BOT_CONFIG_ID=${BOT_CONFIG_ID:-}
      - VISION_LLM_API_URL=${VISION_LLM_API_URL:-}
      - LIVE_MAGIC_NUMBER=${LIVE_MAGIC_NUMBER:-}
      - LIVE_MANAGE_MANUAL_POSITIONS=${LIVE_MANAGE_MANUAL_POSITIONS:-0}

volumes:
  config:
  pydeps:
    external: true
    name: mt5_pydeps_shared
