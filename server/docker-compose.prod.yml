services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: smarf-api
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: "${API_PORT:-8000}"
      RUNNER_DIR: "${RUNNER_HOST_DIR:-/opt/mt5-runner}"
      BOT_RUNNER_PUBLIC_HOST: "${BOT_RUNNER_PUBLIC_HOST:-host.docker.internal}"
      BOT_RUNNER_PUBLIC_PORT: "${BOT_RUNNER_PUBLIC_PORT:-}"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - "${RUNNER_HOST_DIR:-./docker_mt5_bot}:${RUNNER_HOST_DIR:-/opt/mt5-runner}"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: smarf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smarf-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: >
      sh -c 'exec redis-server --save 20 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
